<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 文言は UserMessages.AppTitle / PreviewLoading(aria-label) / WebViewLoadError / WebViewReload と揃える -->
    <title>全文検索システム</title>
    <base href="/" />
    <script>
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'css/app.css?v=' + new Date().getTime();
        document.head.appendChild(link);
    </script>
    <style>
        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: #ff5252;
            color: white;
            text-align: center;
        }
        #blazor-error-ui.visible { display: block; }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot-cute" role="status" aria-label="読み込み中..."><!-- UserMessages.PreviewLoading -->
            <div class="boot-cute__dots" aria-hidden="true">
                <span class="boot-cute__dot"></span>
                <span class="boot-cute__dot"></span>
                <span class="boot-cute__dot"></span>
            </div>
        </div>
        <style>
            .boot-cute {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            .boot-cute__dots {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                gap: 6px;
                height: 16px;
            }
            .boot-cute__dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #656d76;
                animation: boot-dot-wave 1.25s ease-in-out infinite;
            }
            .boot-cute__dot:nth-child(1) { animation-delay: 0s; }
            .boot-cute__dot:nth-child(2) { background: #0969da; animation-delay: 0.15s; }
            .boot-cute__dot:nth-child(3) { animation-delay: 0.3s; }
            @keyframes boot-dot-wave {
                0%, 70%, 100% { transform: translateY(0) scale(0.78); opacity: 0.38; }
                35% { transform: translateY(-4px) scale(1); opacity: 1; }
            }
        </style>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。<a href="" style="color:white;margin-left:8px;">再読み込み</a><!-- UserMessages.WebViewLoadError / WebViewReload と同文言 -->
    </div>

    <script src="js/preview.js?v=5"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script>
        // プレビュー本文のみ拡大縮小（Ctrl + ホイール）。WebView2 既定の全体ズームは抑止。
        (function() {
            var SELECTOR = '.preview-zoom-wrap';
            var CSS_VAR = '--zoom-preview';
            var value = 1.0;
            var MIN = 0.5, MAX = 3.0, STEP = 0.1;

            function setZoom(v) {
                value = v;
                document.documentElement.style.setProperty(CSS_VAR, String(v));
            }
            function clamp(v) {
                v = Math.round(v * 100) / 100;
                return Math.max(MIN, Math.min(MAX, v));
            }
            function isInPreview(target) {
                return target instanceof Element && target.closest(SELECTOR);
            }

            document.addEventListener('wheel', function(e) {
                if (!e.ctrlKey) return;
                e.preventDefault();
                if (!isInPreview(e.target)) return;
                setZoom(clamp(value + (e.deltaY < 0 ? STEP : -STEP)));
            }, { passive: false, capture: true });

            document.addEventListener('keydown', function(e) {
                if (!(e.ctrlKey && (e.key === '0' || e.code === 'Digit0' || e.code === 'Numpad0'))) return;
                if (!isInPreview(document.activeElement) && !isInPreview(e.target)) return;
                e.preventDefault();
                setZoom(1.0);
            }, true);
        })();

        // システムのテーマ設定（prefers-color-scheme）を取得。戻り値: "dark" / "light"
        window.getPreferredColorScheme = function() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
    </script>
</body>
</html>

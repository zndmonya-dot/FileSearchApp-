<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 文言は UserMessages.AppTitle / PreviewLoading / WebViewLoadError / WebViewReload と揃える -->
    <title>全文検索システム</title>
    <base href="/" />
    <script>
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'css/app.css?v=' + new Date().getTime();
        document.head.appendChild(link);
    </script>
    <style>
        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: #ff5252;
            color: white;
            text-align: center;
        }
        #blazor-error-ui.visible { display: block; }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot-cute" role="status" aria-label="読み込み中"><!-- UserMessages.PreviewLoading -->
            <div class="boot-cute__dots" aria-hidden="true">
                <span class="boot-cute__dot"></span>
                <span class="boot-cute__dot"></span>
                <span class="boot-cute__dot"></span>
            </div>
            <p class="boot-cute__label">読み込み中...</p>
        </div>
        <style>
            .boot-cute {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                gap: 10px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            .boot-cute__dots {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                gap: 6px;
                height: 18px;
            }
            .boot-cute__dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                animation: boot-cute-bounce 1.05s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            }
            .boot-cute__dot:nth-child(1) { background: #58a6ff; animation-delay: 0s; }
            .boot-cute__dot:nth-child(2) { background: #79c0ff; animation-delay: 0.13s; }
            .boot-cute__dot:nth-child(3) { background: #bc8cff; animation-delay: 0.26s; }
            .boot-cute__label {
                margin: 0;
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 0;
                line-height: 1;
                color: #656d76;
                white-space: nowrap;
            }
            @keyframes boot-cute-bounce {
                0%, 65%, 100% { transform: translateY(0) scale(0.82); opacity: 0.45; }
                32% { transform: translateY(-5px) scale(1.08); opacity: 1; filter: drop-shadow(0 2px 6px rgba(88, 166, 255, 0.4)); }
            }
        </style>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。<a href="" style="color:white;margin-left:8px;">再読み込み</a><!-- UserMessages.WebViewLoadError / WebViewReload と同文言 -->
    </div>

    <script src="js/preview.js?v=5"></script>
    <script src="_framework/blazor.webview.js"></script>
    <script>
        // 領域別ズーム（Ctrl + ホイールで左サイドバー / 右メインを独立に拡大縮小）。
        // ・WebView2 の既定 Ctrl+ホイール(全体ズーム)を preventDefault で抑止し、対象領域の CSS 変数を更新。
        // ・倍率はメモリ保持のみ（永続化しない）。アプリ再起動・WebView 再読み込みで等倍に戻る。
        // ・Ctrl+0 でフォーカス側の領域を等倍にリセット。
        (function() {
            var ZONES = [
                { selector: '.sidebar', cssVar: '--zoom-sidebar', value: 1.0 },
                { selector: '.main-content', cssVar: '--zoom-main', value: 1.0 }
            ];
            var MIN = 0.5, MAX = 3.0, STEP = 0.1;

            function setVar(zone, value) {
                zone.value = value;
                document.documentElement.style.setProperty(zone.cssVar, String(value));
            }
            function clamp(v) {
                v = Math.round(v * 100) / 100;
                return Math.max(MIN, Math.min(MAX, v));
            }
            function findZone(target) {
                if (!(target instanceof Element)) return null;
                for (var i = 0; i < ZONES.length; i++) {
                    if (target.closest(ZONES[i].selector)) return ZONES[i];
                }
                return null;
            }

            document.addEventListener('wheel', function(e) {
                if (!e.ctrlKey) return;
                e.preventDefault();
                var zone = findZone(e.target);
                if (!zone) return;
                setVar(zone, clamp(zone.value + (e.deltaY < 0 ? STEP : -STEP)));
            }, { passive: false, capture: true });

            document.addEventListener('keydown', function(e) {
                if (!(e.ctrlKey && (e.key === '0' || e.code === 'Digit0' || e.code === 'Numpad0'))) return;
                var zone = findZone(document.activeElement) || findZone(e.target);
                if (!zone) return;
                e.preventDefault();
                setVar(zone, 1.0);
            }, true);
        })();

        // システムのテーマ設定（prefers-color-scheme）を取得。戻り値: "dark" / "light"
        window.getPreferredColorScheme = function() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
    </script>
</body>
</html>
